description: >
    This is a binding for the Microchip I3C interface

compatible: "microchip,mchp-i3c"

include: [i3c-controller.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  pinctrl-0:
    type: phandles
    required: true

  pinctrl-names:
    type: string-array
    required: true

  input-clock-frequency:
    type: int
    required: true
    description: The controller input clock frequency

